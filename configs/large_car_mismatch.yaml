# The large map, searching for a car (as large_car.yaml), with a road map that is wrong in places:
# about 10 % of the road nodes are missing from the map the robots are given, and 5 % of the mapped
# ones are blocked. The robots find out by looking; UAVs report what they find to the UGV.
# uav0 flies low (20 m sensor) and uav1 high (50 m), for every team: the near and far scouts'
# setting (controllers.md, uav_near_scout and uav_far_scout).
# python scripts/compare.py     --config configs/large_car_mismatch.yaml
# python scripts/run_mission.py --config configs/large_car_mismatch.yaml   # one mission per team
teams:
  - joint_planner
  - {ugv0: ugv_timed_route, uav0: uav_greedy_tour, uav1: uav_greedy_tour}
  - {ugv0: ugv_timed_route, uav0: uav_near_scout, uav1: uav_far_scout}
out: outputs/large_car_mismatch

scenario:
  base: large              # large: 5 km x 5 km, 3 towns | small: 1.5 km x 1.5 km, 1 town
  target_object: car       # car | building | hiker
  road_unmapped_fraction: 0.1
  road_blocked_fraction: 0.05
  fleet:
    uav_sensor_ranges: {uav0: 20, uav1: 50}  # the UAV grid follows the smaller one (28 m spacing)

sim:
  radio:
    range_m: {ugv: 300, uav: 300}

mission:
  seed: 0

compare:
  maps: [0, 1, 2, 3, 4]
  targets: 2
  estimator: cv
  workers: 10
